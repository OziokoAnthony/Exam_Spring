version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: examspring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: examspring
      POSTGRES_PASSWORD: examspring
      POSTGRES_DB: examspring
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examspring -d examspring"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: examspring-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
